    LC(Z): "取消"
    LC(X): "切取"
    LC(C): "コピー"
    LC(V): "貼付"
    LC(Y): "やり\n直し"
    LC(W): "閉じる"
    LA(TAB): "Alt\n+Tab"
    LG(TAB): "タスク\nビュー"
    LC(LG(LEFT)): "←\n画面"
    LC(LG(RIGHT)): "画面\n→"
    LG(D): "デスク\nトップ"
    LG(LS(S)): "範囲\nスクショ"
    PSCRN: "PrtSc"
    HOME: "Home"
    END: "End"
  raw_binding_map:
    "&date_paste": "今日の\n日付"
    "&bootloader": "書込\nモード"
    "&tog 5": "Win\nモード"
    "&mkp LCLK": "左\nクリック"
    "&mkp RCLK": "右\nクリック"
    "&bt BT_CLR": "BT\n消去"
  layer_legend_map:
    "0 基本": "基本"
    "1 数字（左Space長押し）": "数字"
    "2 記号（右Enter長押し）": "記号"
    "3 編集（左親指内側長押し）": "編集"
    "4 編集・Windows版（Winモード時のみ）": "編集Win"
    "6 設定（Space＋Enter同時長押し）": "設定"
    "7 自動マウス（トラックボール操作中）": "マウス"
    "8 スクロール（I長押し）": "スクロール"
draw_config:
  key_w: 64
  key_h: 56
  split_gap: 40
  dark_mode: false
  small_pad: 3
  svg_extra_style: |
    svg.keymap { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans CJK JP", sans-serif; font-size: 13px; background-color: #ffffff; }
    text.label { font-size: 15px; font-weight: bold; }
    text.hold, text.shifted { font-size: 9px; }
